<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boujee Insights</title>
  <style>
    /* STRICT 0px BORDER RADIUS & DARK THEME */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0px !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app-card {
      width: 100%;
      max-width: 440px;
      background: #0a0a0a;
      border: 1px solid #dc2626;
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.15);
      padding: 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-logo {
      height: 60px;
      width: auto;
      object-fit: contain;
      margin-bottom: 12px;
      display: inline-block;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .brand-title span {
      color: #dc2626;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #a1a1aa;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"],
    textarea {
      width: 100%;
      background-color: #121212;
      border: 1px solid #27272a;
      color: #ffffff;
      padding: 12px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus,
    textarea:focus {
      border-color: #dc2626;
      background-color: #18181b;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn-red {
      width: 100%;
      background-color: #dc2626;
      color: #ffffff;
      border: 1px solid #ef4444;
      padding: 14px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-red:hover {
      background-color: #b91c1c;
    }

    .btn-red:disabled {
      background-color: #450a0a;
      border-color: #7f1d1d;
      color: #78716c;
      cursor: not-allowed;
    }

    .response-box {
      margin-top: 20px;
      padding: 14px;
      background-color: #121212;
      border-left: 3px solid #dc2626;
      font-size: 0.9rem;
      color: #d4d4d8;
      line-height: 1.5;
      display: none;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <img src="b.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand-title">BOUJEE <span>INSIGHTS</span></div>
    </div>

    <form id="insights-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" value="ronaldkakooza72@gmail.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>

      <div class="form-group">
        <label for="question">Question</label>
        <textarea id="question" placeholder="e.g. Give me a breakdown of active campaigns and total user submissions." required></textarea>
      </div>

      <button type="submit" id="submit-btn" class="btn-red">SEND QUERY</button>
    </form>

    <div id="output-box" class="response-box"></div>
  </div>

  <script>
    const FIREBASE_API_KEY = "AIzaSyAdToVQOzBO8_dZUJuKRPoNb2ci8uAUilo";
    const WORKER_URL = "https://boujee-insights-worker.kakoozaronald71.workers.dev/ask";

    document.getElementById("insights-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const question = document.getElementById("question").value.trim();
      const btn = document.getElementById("submit-btn");
      const output = document.getElementById("output-box");

      btn.disabled = true;
      btn.innerText = "PROCESSING...";
      output.style.display = "block";
      output.style.borderLeftColor = "#dc2626";
      output.innerText = "Authenticating with Firebase...";

      try {
        // Step 1: Exchange credentials for idToken directly using embedded API Key
        const authRes = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, returnSecureToken: true })
        });

        const authData = await authRes.json();
        if (!authRes.ok) {
          throw new Error(authData.error?.message || "Authentication failed. Check password.");
        }

        output.innerText = "Authenticated. Querying Cloudflare Worker...";

        // Step 2: Send idToken and Question to Cloudflare Worker
        const workerRes = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            idToken: authData.idToken,
            question: question
          })
        });

        const workerData = await workerRes.json();
        if (!workerRes.ok) {
          throw new Error(workerData.error || "Worker query failed.");
        }

        // Step 3: Display Answer
        output.style.borderLeftColor = "#dc2626";
        output.innerText = workerData.answer || JSON.stringify(workerData);

      } catch (err) {
        output.style.borderLeftColor = "#ef4444";
        output.innerText = "Error: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "SEND QUERY";
      }
    });
  </script>
</body>
</html>
